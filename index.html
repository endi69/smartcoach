<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartCoach">
  <meta name="description" content="SmartCoach: forza, ipertrofia, base aerobica, readiness e progressione.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>SmartCoach</title>
</head>
<body>
  <div id="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SMARTCOACH <span id="version"></span></p>
        <h1 id="title">Oggi</h1>
        <p id="sub">Ipertrofia + base aerobica, adattate al recupero</p>
      </div>
      <button class="icon-btn" id="quickCheck" aria-label="Check-in">◎</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button data-tab="today" class="active"><span>⌂</span><small>Oggi</small></button>
      <button data-tab="week"><span>▦</span><small>Settimana</small></button>
      <button data-tab="train"><span>＋</span><small>Training</small></button>
      <button data-tab="trend"><span>↗</span><small>Trend</small></button>
      <button data-tab="more"><span>•••</span><small>Altro</small></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
